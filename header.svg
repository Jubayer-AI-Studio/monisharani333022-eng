<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" height="220">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="220" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="200" y1="0" x2="200" y2="220" />
    <line x1="400" y1="0" x2="400" y2="220" />
    <line x1="600" y1="0" x2="600" y2="220" />
    <line x1="800" y1="0" x2="800" y2="220" />
    <line x1="1000" y1="0" x2="1000" y2="220" />
  </g>

  <!-- Ambient light orb in background -->
  <circle cx="600" cy="50" r="160" fill="#0284c7" opacity="0.12" filter="url(#glow)" />
  <circle cx="850" cy="80" r="120" fill="#818cf8" opacity="0.08" filter="url(#glow)" />

  <!-- Top Decorative Status Bar -->
  <g transform="translate(60, 36)">
    <circle cx="0" cy="0" r="4" fill="#34d399" />
    <text x="14" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#34d399" letter-spacing="2">SYSTEM OPERATIONAL • READY TO DEPLOY</text>
  </g>

  <!-- Main Hero Title -->
  <text x="600" y="112" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5">
    Jubayer Ahmad
  </text>

  <!-- Subtitle -->
  <text x="600" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="500" fill="#94a3b8" letter-spacing="1">
    Senior Software Engineer &amp; AI Systems Architect
  </text>

  <!-- Bottom Tech Horizon Wave -->
  <path d="M0,195 Q300,165 600,190 T1200,185 L1200,220 L0,220 Z" fill="url(#waveGrad)" opacity="0.85" />
  <path d="M0,205 Q400,180 800,205 T1200,200 L1200,220 L0,220 Z" fill="#0284c7" opacity="0.4" />
</svg>
